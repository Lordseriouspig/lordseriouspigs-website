services:
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    networks:
      lordseriouspigs-website-net:
    logging:
      driver: loki
      options:
        loki-url: "https://loki.lordseriouspig.au/loki/api/v1/push"
        loki-external-labels: "service=lordseriouspigs-website-backend,host=nest"

  nginx:
    build: ./frontend
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      lordseriouspigs-website-net:
        ipv4_address: 172.20.0.10
    logging:
      driver: loki
      options:
        loki-url: "https://loki.lordseriouspig.au/loki/api/v1/push"
        loki-external-labels: "service=lordseriouspigs-website-nginx,host=nest"
networks:
  lordseriouspigs-website-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16